name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Check formatting
        run: bunx oxfmt --check

      - name: Lint
        run: bunx oxlint

      - name: Test the type chart
        run: bun test

      - name: Build
        # Project sites are served from /<repo>/, so vite needs that as its base.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build

      - uses: actions/configure-pages@v6

      # v4+ excludes dotfiles from the artifact; the vite build emits none.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
